<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Roboto+Mono:wght@300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Nunito&family=Roboto+Mono:wght@300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <title>A.S.H</title>
    </head>
    <body>
     <div id="maincon">
        <div id="chat-log"></div>
        <div id="botframe">
            <div id="tts-controls" style="text-align: right; padding-right: 2%; margin-bottom: 5px;">
               <div id="inputs">
                  <button id="tts-toggle" style="background: transparent; color: #FFFFFF; border: 1px solid #FFFFFF; border-radius: 4px; cursor: pointer;">
                     🔊 TTS: OFF
                  </button>
                  <button id="mic-button" title="Click to speak">🎤</button>
                  <button id="send-button">Send</button>
               </div>
            </div>

            <div id="input-frame">
               <input type="text" id="input-field" placeholder="Talk to ASH...">
            </div>
        </div>
     </div>
     <script>
        window.USERNAME = "{{ user }}";
     </script>
     <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
     <script src="{{ url_for('static', filename='renderer.js') }}"></script>
    </body>
</html>
