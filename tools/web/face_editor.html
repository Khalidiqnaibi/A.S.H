<!DOCTYPE html>
<!--
  face_editor.html -- A.S.H robot face animation editor.

  Single file, zero dependencies, opens with a double click. Exports the same
  JSON that src/face/model.py reads.

  THE ONE RULE FOR MAINTAINING THIS FILE: the renderer and interpolator below
  must stay behaviourally identical to render.py and model.py. If they drift,
  animations look right here and wrong on the robot, which is the worst
  possible failure for an authoring tool. Both sides are deliberately small so
  that staying in sync is tractable; the porting notes are inline where the
  two implementations had to differ.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>A.S.H Face Editor</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#e6edf3;
    --dim:#8b949e; --accent:#00c8ff; --warn:#f78166; --ok:#3fb950;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:grid; grid-template-columns:1fr 300px; grid-template-rows:auto 1fr auto;
    height:100vh; gap:1px;
  }
  header {
    grid-column:1/-1; background:var(--panel); padding:8px 14px;
    border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center;
    flex-wrap:wrap;
  }
  header h1 { font-size:13px; margin:0 12px 0 0; letter-spacing:.08em; color:var(--accent); }
  button, select, input[type=text], input[type=number] {
    background:#21262d; color:var(--ink); border:1px solid var(--line);
    border-radius:5px; padding:4px 9px; font:inherit; cursor:pointer;
  }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#04121a; font-weight:600; border-color:var(--accent); }
  button.danger:hover { border-color:var(--warn); color:var(--warn); }
  #stage { background:#000; display:flex; align-items:center; justify-content:center;
           position:relative; overflow:hidden; }
  #face { image-rendering:pixelated; }
  #stageinfo { position:absolute; top:8px; left:10px; color:var(--dim); font-size:11px; }
  #side { background:var(--panel); overflow-y:auto; padding:10px; border-left:1px solid var(--line); }
  #timeline { grid-column:1/-1; background:var(--panel); border-top:1px solid var(--line);
              padding:8px 12px; height:150px; overflow-x:auto; }
  .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .row label { width:78px; color:var(--dim); font-size:11px; flex:none; }
  .row input[type=range] { flex:1; accent-color:var(--accent); }
  .row .val { width:46px; text-align:right; font-size:11px; color:var(--accent); }
  h3 { font-size:11px; text-transform:uppercase; letter-spacing:.1em;
       color:var(--dim); margin:14px 0 6px; border-bottom:1px solid var(--line);
       padding-bottom:3px; }
  #track { position:relative; height:46px; background:#0d1117; border:1px solid var(--line);
           border-radius:5px; margin-top:6px; }
  .kf { position:absolute; top:6px; width:12px; height:32px; margin-left:-6px;
        background:var(--accent); border-radius:3px; cursor:grab; opacity:.75; }
  .kf.sel { opacity:1; outline:2px solid #fff; }
  #playhead { position:absolute; top:0; width:2px; height:100%; background:var(--warn);
              pointer-events:none; }
  #kflist { display:flex; gap:5px; flex-wrap:wrap; margin-top:7px; }
  .chip { background:#21262d; border:1px solid var(--line); border-radius:4px;
          padding:2px 7px; font-size:11px; cursor:pointer; }
  .chip.sel { border-color:var(--accent); color:var(--accent); }
  .hint { color:var(--dim); font-size:11px; margin:4px 0; }
  .split { display:flex; gap:5px; }
  .split button { flex:1; }
  #status { color:var(--ok); font-size:11px; margin-left:auto; }
  textarea { width:100%; height:120px; background:#0d1117; color:var(--ink);
             border:1px solid var(--line); border-radius:5px; font:11px monospace; padding:6px; }
</style>
</head>
<body>

<header>
  <h1>A.S.H FACE</h1>
  <select id="libsel" title="Pick an animation"></select>
  <button onclick="loadSelected()">Load</button>
  <button onclick="newAnim()">New</button>
  <input type="text" id="animname" value="untitled" size="14" title="Animation name (lowercase letters, digits, _ or -)"
         onchange="pushHistory('name'); render()">
  <button class="primary" onclick="saveAnim()" id="savebtn" title="Save into animations/ (Ctrl+S)">Save</button>
  <button class="danger" onclick="deleteSaved()" id="delbtn" title="Delete the saved file; a builtin of the same name comes back">Delete file</button>
  <button onclick="undo()" title="Ctrl+Z">↶</button>
  <button onclick="redo()" title="Ctrl+Y">↷</button>
  <button class="primary" onclick="togglePlay()" id="playbtn">▶ Play</button>
  <label class="hint"><input type="checkbox" id="loop" onchange="pushHistory('props'); render()"> loop</label>
  <label class="hint"><input type="checkbox" id="blinker" checked> auto-blink</label>
  <button onclick="addKey()">+ Key</button>
  <button class="danger" onclick="delKey()">− Key</button>
  <button onclick="exportJSON()" title="Download the JSON">Export</button>
  <button onclick="document.getElementById('file').click()">Import</button>
  <input type="file" id="file" accept=".json" style="display:none" onchange="importJSON(event)">
  <span id="dirty" class="hint"></span>
  <span id="status"></span>
</header>

<div id="stage">
  <canvas id="face" width="128" height="64" style="width:640px;height:320px"></canvas>
  <div id="stageinfo"></div>
</div>

<div id="side">
  <h3>Keyframe</h3>
  <div class="row"><label>time (s)</label>
    <input type="number" id="kftime" step="0.01" min="0" style="width:70px" onchange="setKeyTime()">
    <select id="kfease" onchange="setKeyEase()" style="flex:1"></select>
  </div>
  <div class="split" style="margin-bottom:5px">
    <button onclick="dupKey()" title="Copy this keyframe 0.2s later">Dup</button>
    <button onclick="copyPose()" title="Remember this keyframe's values">Copy</button>
    <button onclick="pastePose()" title="Write the remembered values into this keyframe">Paste</button>
  </div>
  <div class="split">
    <button onclick="setTarget('both')" id="tb-both" class="chip sel">both</button>
    <button onclick="setTarget('left')" id="tb-left" class="chip">left</button>
    <button onclick="setTarget('right')" id="tb-right" class="chip">right</button>
  </div>
  <p class="hint">Sliders write to the selected eye(s). Only changed values are
  stored in the keyframe; everything else carries forward.</p>

  <h3>Eye</h3>
  <div id="eyectl"></div>

  <h3>Face</h3>
  <div id="facectl"></div>

  <h3>Animation</h3>
  <div class="row"><label>priority</label>
    <input type="number" id="prio" min="0" max="1000" step="1" value="50" style="width:70px"
           onchange="pushHistory('props'); render()"></div>
  <label class="hint"><input type="checkbox" id="interr" checked onchange="pushHistory('props'); render()"> interruptible</label><br>
  <label class="hint"><input type="checkbox" id="bsup" onchange="pushHistory('props'); render()"> suppress auto-blink</label><br>
  <label class="hint"><input type="checkbox" id="hold" checked onchange="pushHistory('props'); render()"> hold last pose</label>
  <div class="row"><label>tags</label>
    <input type="text" id="tags" placeholder="comma, separated" style="flex:1;min-width:0"
           onchange="pushHistory('props'); render()"></div>
  <div class="row"><label>time ×</label>
    <input type="number" id="tscale" value="1.5" step="0.1" min="0.1" style="width:70px">
    <button onclick="scaleTime()">Scale</button>
    <button onclick="mirrorAnim()" title="Swap left and right, flip look/tilt/x/rotation">Mirror</button></div>
  <div class="split" style="margin-top:6px">
    <button onclick="checkRobot()" id="chkbtn" title="Ask the Python interpolator for the same poses and compare">Check vs robot</button>
  </div>

  <h3>Export</h3>
  <div class="split">
    <button onclick="copyJSON()">Copy JSON</button>
    <button onclick="recordGIF()">Frames→PNG</button>
  </div>
  <textarea id="json" spellcheck="false"></textarea>
</div>

<div id="timeline">
  <div class="row">
    <label>duration</label>
    <input type="number" id="duration" step="0.1" min="0.1" value="1.0" style="width:70px"
           onchange="pushHistory('props'); render()">
    <label style="width:auto">scrub</label>
    <input type="range" id="scrub" min="0" max="1000" value="0" oninput="scrubTo()">
    <span class="val" id="tlabel">0.00</span>
  </div>
  <div id="track" onclick="trackClick(event)"><div id="playhead"></div></div>
  <div id="kflist"></div>
</div>

<script>
/* ====================================================================
   MODEL -- must match src/face/model.py
   ==================================================================== */
const REF_W = 128, REF_H = 64;

const EASINGS = {
  linear: t => t,
  in:     t => t*t,
  out:    t => 1-(1-t)**2,
  in_out: t => t<0.5 ? 2*t*t : 1-(-2*t+2)**2/2,
  in_cubic:  t => t**3,
  out_cubic: t => 1-(1-t)**3,
  back:   t => 1 + 2.70158*(t-1)**3 + 1.70158*(t-1)**2,
  elastic:t => t===0?0:t===1?1:-(2**(10*t-10))*Math.sin((t*10-10.75)*2.0944),
  bounce: t => { const n=7.5625,d=2.75;
    if(t<1/d) return n*t*t;
    if(t<2/d){t-=1.5/d; return n*t*t+0.75;}
    if(t<2.5/d){t-=2.25/d; return n*t*t+0.9375;}
    t-=2.625/d; return n*t*t+0.984375; },
  step:   t => t<1?0:1,
};

const EYE_DEFAULTS = {
  x:0, y:0, w:36, h:36, radius:10,
  radius_tl:null, radius_tr:null, radius_br:null, radius_bl:null,
  lid_top:0, lid_bottom:0, lid_angle:0, open:1, rotation:0,
};
const FACE_DEFAULTS = { look_x:0, look_y:0, gap:20, scale:1, brightness:1, tilt:0 };

// Slider ranges. Kept here rather than in the Python so the runtime has no
// opinion about UI; the model clamps where it matters (radius, lids).
const EYE_CTL = [
  ["w",4,64,1],["h",4,64,1],["radius",0,32,1],
  ["radius_tl",0,32,1],["radius_tr",0,32,1],["radius_br",0,32,1],["radius_bl",0,32,1],
  ["lid_top",0,1,0.01],["lid_bottom",0,1,0.01],["lid_angle",-40,40,1],
  ["open",0,1,0.01],["x",-30,30,1],["y",-20,20,1],["rotation",-30,30,1],
];
const FACE_CTL = [
  ["look_x",-24,24,1],["look_y",-16,16,1],["gap",0,60,1],
  ["scale",0.4,1.6,0.01],["brightness",0,1,0.01],["tilt",-20,20,1],
];

function restPose(){
  return { left:{...EYE_DEFAULTS}, right:{...EYE_DEFAULTS}, ...FACE_DEFAULTS };
}

/* Interpolation. Mirrors Animation.sample() including the mirrored
   lid_angle on the right eye -- that asymmetry is load-bearing and the two
   implementations disagreeing on it would be very confusing to debug. */
/* No mirroring here. lid_angle is anatomical -- one value, both eyes -- and
   the renderer below is the single place that knows which screen-space edge
   of each eye faces the nose. Mirroring in both places cancels out, which is
   a bug the Python side shipped with briefly. */
function resolved(kf, side){
  return {...(kf.both||{}), ...(kf[side]||{})};
}

function sample(anim, t){
  const pose = restPose();
  const kfs = (anim.keyframes||[]).slice().sort((a,b)=>a.t-b.t);
  if(!kfs.length) return pose;

  const dur = anim.duration || kfs[kfs.length-1].t || 1e-9;
  if(anim.loop && dur>0) t = ((t % dur) + dur) % dur;

  let pl={}, pr={}, pf={}, pt=0, nxt=null;
  for(const kf of kfs){
    if(kf.t <= t){
      Object.assign(pl, resolved(kf,"left"));
      Object.assign(pr, resolved(kf,"right"));
      Object.assign(pf, kf.face||{});
      pt = kf.t;
    } else { nxt = kf; break; }
  }

  const apply = (l,r,f)=>{
    Object.assign(pose.left, l); Object.assign(pose.right, r); Object.assign(pose, f);
  };

  if(!nxt){ if(anim.hold_last !== false) apply(pl,pr,pf); return pose; }

  const span = Math.max(1e-9, nxt.t - pt);
  const u = (EASINGS[nxt.ease]||EASINGS.linear)(Math.min(1,Math.max(0,(t-pt)/span)));
  const lerp=(a,b,u)=>a+(b-a)*u;

  const cl={...pl}, cr={...pr}, cf={...pf};
  const tl=resolved(nxt,"left"), tr=resolved(nxt,"right"), tf=nxt.face||{};
  for(const k in tl) cl[k]=lerp(pl[k]!==undefined?pl[k]:(EYE_DEFAULTS[k]||0), tl[k], u);
  for(const k in tr) cr[k]=lerp(pr[k]!==undefined?pr[k]:(EYE_DEFAULTS[k]||0), tr[k], u);
  for(const k in tf) cf[k]=lerp(pf[k]!==undefined?pf[k]:(FACE_DEFAULTS[k]||0), tf[k], u);
  apply(cl,cr,cf);
  return pose;
}

/* ====================================================================
   RENDERER -- must match src/face/render.py
   Canvas gives us real clipping, so lids are drawn as covering rects
   exactly as the Python does (rather than as clip paths) to keep the
   visual result identical, including the angled top lid.
   ==================================================================== */
const cv = document.getElementById("face"), ctx = cv.getContext("2d");

/* r is one radius or [tl,tr,br,bl]; each is clamped to half the shorter
   side exactly as render.py clamps it. */
function roundRect(c,x,y,w,h,r){
  const m = Math.min(w,h)/2;
  const [tl,tr,br,bl] = (Array.isArray(r)?r:[r,r,r,r]).map(v=>Math.max(0,Math.min(v,m)));
  c.beginPath();
  c.moveTo(x+tl,y);
  c.lineTo(x+w-tr,y); c.quadraticCurveTo(x+w,y,x+w,y+tr);
  c.lineTo(x+w,y+h-br); c.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
  c.lineTo(x+bl,y+h); c.quadraticCurveTo(x,y+h,x,y+h-bl);
  c.lineTo(x,y+tl); c.quadraticCurveTo(x,y,x+tl,y);
  c.closePath();
}

function drawFace(pose){
  const W=cv.width, H=cv.height;
  ctx.save();
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);

  if(pose.tilt){ ctx.translate(W/2,H/2); ctx.rotate(-pose.tilt*Math.PI/180); ctx.translate(-W/2,-H/2); }

  const b = Math.max(0,Math.min(1,pose.brightness));
  const fg = `rgb(0,${Math.round(200*b)},${Math.round(255*b)})`;
  const gap = pose.gap * pose.scale;

  for(const [side,sign] of [["left",-1],["right",1]]){
    const e = pose[side];
    const ew = e.w*pose.scale, eh = e.h*pose.scale*Math.max(0,e.open);
    const ecx = W/2 + sign*(gap/2+ew/2) + (e.x + pose.look_x);
    const ecy = H/2 + (e.y + pose.look_y);

    if(e.open<=0.001 || e.w<=0){
      ctx.fillStyle=fg;
      roundRect(ctx, ecx-ew/2, ecy-1.5, ew, 3, 1.5); ctx.fill();
      continue;
    }

    const x0=ecx-ew/2, y0=ecy-eh/2;
    ctx.save();
    ctx.translate(ecx,ecy); ctx.rotate(e.rotation*Math.PI/180); ctx.translate(-ecx,-ecy);

    ctx.fillStyle=fg;
    const rs = pose.scale;
    roundRect(ctx,x0,y0,ew,eh,[e.radius_tl??e.radius, e.radius_tr??e.radius,
                               e.radius_br??e.radius, e.radius_bl??e.radius].map(v=>v*rs)); ctx.fill();

    ctx.fillStyle="#000";
    if(e.lid_top>0.001 || Math.abs(e.lid_angle)>0.01){
      const base = eh*Math.min(1,Math.max(0,e.lid_top));
      const drop = Math.tan(e.lid_angle*Math.PI/180)*ew/2;
      const innerY = y0+base+drop;   // toward the nose: positive angle lowers it
      const outerY = y0+base-drop;   // toward the temple
      const [lY,rY] = sign<0 ? [outerY,innerY] : [innerY,outerY];
      ctx.beginPath();
      ctx.moveTo(x0-2,y0-2); ctx.lineTo(x0+ew+2,y0-2);
      ctx.lineTo(x0+ew+2,rY); ctx.lineTo(x0-2,lY);
      ctx.closePath(); ctx.fill();
    }
    if(e.lid_bottom>0.001){
      const cut = eh*Math.min(1,e.lid_bottom);
      ctx.fillRect(x0-2, y0+eh-cut, ew+4, cut+2);
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ====================================================================
   EDITOR STATE
   ==================================================================== */
let anim = { name:"untitled", duration:1.0, loop:false, hold_last:true,
             priority:50, keyframes:[ {t:0, both:{}, left:{}, right:{}, face:{}, ease:"in_out"} ] };
let sel = 0, target = "both", playing = false, playT = 0, lastFrame = 0;
let blinkPhase = 0, nextBlink = 2;
let hasServer = false;        // true when served by `python -m src.face edit`
let library = [];             // [{name, source, ...}] from the server
let snapshot = "";            // serialised text at last load/save, for the dirty flag
let history = [], future = [], lastPush = {tag:"", at:0};
let clip = null;              // copied keyframe values

const BUILTIN_NAMES = ["blink","double_blink","wink","idle","look_around","sleepy",
  "sleeping","happy","very_happy","sad","angry","annoyed","surprised","confused",
  "skeptical","curious","love","thinking","listening","speaking","processing",
  "acknowledge","refuse","alert","error","boot","shutdown"];

/* A few builtins inlined so the editor is genuinely standalone -- you can
   open this file with no ASH checkout and still have something to edit.
   The full set lives in src/face/library.py; `python -m src.face export`
   writes them all to animations/builtin/ for importing here. */
const INLINE = {
  blink:{name:"blink",duration:0.30,keyframes:[
    {t:0,both:{open:1},ease:"in"},{t:0.09,both:{open:0.06},ease:"in"},
    {t:0.13,both:{open:0.06},ease:"linear"},{t:0.30,both:{open:1},ease:"out"}]},
  happy:{name:"happy",duration:1.6,keyframes:[
    {t:0,both:{lid_bottom:0,h:36,radius:10}},
    {t:0.22,both:{lid_bottom:0.34,h:38,radius:16},ease:"out"},
    {t:1.6,both:{lid_bottom:0.34},ease:"linear"}]},
  angry:{name:"angry",duration:1.4,keyframes:[
    {t:0,both:{lid_top:0,lid_angle:0}},
    {t:0.16,both:{lid_top:0.34,lid_angle:22,radius:5,h:34},ease:"in"},
    {t:1.4,both:{lid_top:0.34,lid_angle:22}}]},
  sad:{name:"sad",duration:2.2,keyframes:[
    {t:0,both:{lid_top:0,lid_angle:0}},
    {t:0.45,both:{lid_top:0.30,lid_angle:-16,h:32},face:{look_y:3},ease:"out"},
    {t:2.2,both:{lid_top:0.30}}]},
  surprised:{name:"surprised",duration:1.3,keyframes:[
    {t:0,both:{w:36,h:36}},
    {t:0.11,both:{w:44,h:46,radius:20,lid_top:0},ease:"back"},
    {t:0.70,both:{w:42,h:44}},{t:1.30,both:{w:38,h:38},ease:"out"}]},
  thinking:{name:"thinking",duration:3.4,loop:true,keyframes:[
    {t:0,face:{look_x:0,look_y:0}},
    {t:0.4,face:{look_x:7,look_y:-5},both:{lid_top:0.12},ease:"out"},
    {t:1.5,face:{look_x:9,look_y:-6}},{t:2.4,face:{look_x:5,look_y:-4}},
    {t:3.4,face:{look_x:8,look_y:-6}}]},
  confused:{name:"confused",duration:1.6,keyframes:[
    {t:0,left:{h:36},right:{h:36},face:{tilt:0}},
    {t:0.35,left:{h:28,lid_top:0.22},right:{h:40},face:{tilt:-7},ease:"out"},
    {t:1.6,face:{tilt:-7}}]},
};

function init(){
  const ls = document.getElementById("libsel");
  BUILTIN_NAMES.forEach(n=>{
    const o=document.createElement("option");
    o.value=n; o.textContent=n + (INLINE[n]?"":"  (import)"); ls.appendChild(o);
  });
  const es = document.getElementById("kfease");
  Object.keys(EASINGS).forEach(n=>{
    const o=document.createElement("option"); o.value=n; o.textContent=n; es.appendChild(o);
  });
  buildControls();
  writeProps();
  snapshot = JSON.stringify(serialise());
  render();
  requestAnimationFrame(tick);
  detectServer();
}

/* ---- server (optional) ------------------------------------------------ */
async function api(method, path, body){
  const r = await fetch(path, {method, headers: body?{"Content-Type":"application/json"}:{},
                               body: body?JSON.stringify(body):undefined});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error((j.errors||[j.error||r.statusText]).join("; ")), {status:r.status});
  return j;
}

async function detectServer(){
  if(/^https?:$/.test(location.protocol)){
    try { await api("GET","/api/ping"); hasServer = true; }
    catch(e){ hasServer = false; }
  }
  document.getElementById("delbtn").style.display = hasServer ? "" : "none";
  document.getElementById("chkbtn").style.display = hasServer ? "" : "none";
  document.getElementById("savebtn").title = hasServer
    ? "Save into animations/ (Ctrl+S)"
    : "No server: downloads the JSON (run python -m src.face edit to save into animations/)";
  await refreshLibrary();
  flash(hasServer ? "connected: saving to animations/" : "standalone: Save downloads a file");
}

async function refreshLibrary(keep){
  const ls = document.getElementById("libsel");
  const want = keep || ls.value;
  if(hasServer){
    try { library = (await api("GET","/api/library")).animations; } catch(e){ library = []; }
  } else {
    library = BUILTIN_NAMES.map(n=>({name:n, source:"builtin"}));
  }
  ls.innerHTML = "";
  library.forEach(a=>{
    const o=document.createElement("option"); o.value=a.name;
    o.textContent = a.name + (a.source==="user"?"   ★ saved":a.source==="override"?"   ✎ edited":
                              (!hasServer && !INLINE[a.name]?"   (import)":""));
    ls.appendChild(o);
  });
  if(want && library.some(a=>a.name===want)) ls.value = want;
}

function buildControls(){
  const mk = (list, host, isFace) => {
    host.innerHTML = "";
    list.forEach(([k,min,max,step])=>{
      const row = document.createElement("div"); row.className="row";
      row.innerHTML = `<label id="lab-${k}" title="${k}">${k}</label>
        <input type="range" min="${min}" max="${max}" step="${step}" id="ctl-${k}">
        <span class="val" id="val-${k}">0</span>
        <button class="chip" title="Unset in this keyframe (inherit from earlier)" id="un-${k}"
                style="padding:0 5px">✕</button>`;
      host.appendChild(row);
      row.querySelector("input").addEventListener("input", e=>{
        setParam(k, parseFloat(e.target.value), isFace);
      });
      row.querySelector("button").addEventListener("click", ()=>unsetParam(k, isFace));
    });
  };
  mk(EYE_CTL, document.getElementById("eyectl"), false);
  mk(FACE_CTL, document.getElementById("facectl"), true);
}

function kf(){ return anim.keyframes[sel]; }

function setParam(k, v, isFace){
  pushHistory("param:"+k);
  const f = kf();
  if(isFace){ f.face = f.face||{}; f.face[k]=v; }
  else if(target==="both"){ f.both=f.both||{}; f.both[k]=v; delete (f.left||{})[k]; delete (f.right||{})[k]; }
  else { f[target]=f[target]||{}; f[target][k]=v; }
  playT = f.t;
  render();
}

function isSetHere(k, isFace){
  const f = kf();
  if(isFace) return !!f.face && k in f.face;
  if(target==="both") return [f.both,f.left,f.right].some(o=>o && k in o);
  return (!!f[target] && k in f[target]) || (!!f.both && k in f.both);
}

function unsetParam(k, isFace){
  pushHistory("unset");
  const f = kf();
  if(isFace) delete (f.face||{})[k];
  else if(target==="both"){ for(const o of [f.both,f.left,f.right]) if(o) delete o[k]; }
  else { delete (f[target]||{})[k];
         // a shared `both` value would still apply: keep it on the other eye only
         if(f.both && k in f.both){ const o=target==="left"?"right":"left";
           f[o]=f[o]||{}; if(!(k in f[o])) f[o][k]=f.both[k]; delete f.both[k]; } }
  render();
}

function syncControls(){
  const pose = sample(anim, playT);
  const eye = pose[target==="right"?"right":"left"];
  EYE_CTL.forEach(([k])=>{
    const el=document.getElementById("ctl-"+k); if(!el) return;
    const eff = eye[k] ?? (k.startsWith("radius_") ? eye.radius : EYE_DEFAULTS[k]) ?? 0;
    el.value = eff;
    document.getElementById("val-"+k).textContent = (+eff).toFixed(2);
    const set = isSetHere(k,false);
    document.getElementById("lab-"+k).style.color = set ? "var(--accent)" : "";
    document.getElementById("un-"+k).style.visibility = set ? "visible" : "hidden";
  });
  FACE_CTL.forEach(([k])=>{
    const el=document.getElementById("ctl-"+k); if(!el) return;
    el.value = pose[k] ?? FACE_DEFAULTS[k] ?? 0;
    document.getElementById("val-"+k).textContent = (+el.value).toFixed(2);
    const set = isSetHere(k,true);
    document.getElementById("lab-"+k).style.color = set ? "var(--accent)" : "";
    document.getElementById("un-"+k).style.visibility = set ? "visible" : "hidden";
  });
  document.getElementById("kftime").value = kf().t.toFixed(2);
  document.getElementById("kfease").value = kf().ease || "in_out";
}

function render(){
  anim.duration = parseFloat(document.getElementById("duration").value)||1;
  anim.loop = document.getElementById("loop").checked;
  anim.name = document.getElementById("animname").value || "untitled";
  readProps();

  let pose = sample(anim, playT);

  // Preview the auto-blink layer exactly as FacePlayer applies it: a
  // multiplier on `open`, not part of the animation.
  if(document.getElementById("blinker").checked && playing){
    if(playT >= nextBlink){
      blinkPhase = playT;
      nextBlink = playT + 2 + Math.random()*4;
    }
    const bt = playT - blinkPhase;
    if(bt >= 0 && bt < 0.30){
      const f = sample(INLINE.blink, bt).left.open;
      pose.left.open *= f; pose.right.open *= f;
    }
  }

  drawFace(pose);
  drawTrack();
  syncControls();
  document.getElementById("tlabel").textContent = playT.toFixed(2);
  document.getElementById("scrub").value = Math.round(1000*playT/(anim.duration||1));
  document.getElementById("stageinfo").textContent =
    `${anim.name}  ·  ${anim.keyframes.length} keys  ·  ${anim.duration.toFixed(2)}s` +
    (anim.loop?"  ·  loop":"");
  const txt = JSON.stringify(serialise(), null, 2);
  const ta = document.getElementById("json");
  if(ta.value !== txt) ta.value = txt;
  const dirty = JSON.stringify(serialise()) !== snapshot;
  document.getElementById("dirty").textContent = dirty ? "● unsaved" : "";
  document.title = (dirty?"* ":"") + "A.S.H Face Editor";
}

function readProps(){
  anim.priority = parseInt(document.getElementById("prio").value);
  if(!Number.isFinite(anim.priority)) anim.priority = 50;
  anim.interruptible = document.getElementById("interr").checked;
  anim.blink_suppress = document.getElementById("bsup").checked;
  anim.hold_last = document.getElementById("hold").checked;
  anim.tags = document.getElementById("tags").value.split(",").map(t=>t.trim()).filter(Boolean);
}
function writeProps(){
  document.getElementById("animname").value = anim.name;
  document.getElementById("duration").value = anim.duration;
  document.getElementById("loop").checked = !!anim.loop;
  document.getElementById("prio").value = anim.priority ?? 50;
  document.getElementById("interr").checked = anim.interruptible !== false;
  document.getElementById("bsup").checked = !!anim.blink_suppress;
  document.getElementById("hold").checked = anim.hold_last !== false;
  document.getElementById("tags").value = (anim.tags||[]).join(", ");
}

/* ---- undo / redo ----------------------------------------------------- */
function pushHistory(tag){
  const now = performance.now();
  // a slider drag fires many input events: one undo step for the whole drag
  if(tag && tag===lastPush.tag && now-lastPush.at < 700){ lastPush.at = now; return; }
  lastPush = {tag, at: now};
  history.push(JSON.stringify({anim, sel}));
  if(history.length > 200) history.shift();
  future = [];
}
function restore(str){
  const d = JSON.parse(str);
  anim = d.anim; sel = Math.min(d.sel, anim.keyframes.length-1);
  writeProps(); playT = Math.min(playT, anim.duration); render();
}
function undo(){
  if(!history.length){ flash("nothing to undo","warn"); return; }
  future.push(JSON.stringify({anim, sel}));
  lastPush = {tag:"", at:0};
  restore(history.pop());
}
function redo(){
  if(!future.length){ flash("nothing to redo","warn"); return; }
  history.push(JSON.stringify({anim, sel}));
  lastPush = {tag:"", at:0};
  restore(future.pop());
}

function drawTrack(){
  const track = document.getElementById("track");
  [...track.querySelectorAll(".kf")].forEach(n=>n.remove());
  const w = track.clientWidth;
  anim.keyframes.forEach((k,i)=>{
    const d = document.createElement("div");
    d.className = "kf" + (i===sel?" sel":"");
    d.style.left = (w * k.t/(anim.duration||1)) + "px";
    d.title = `t=${k.t.toFixed(2)} ${k.ease}`;
    d.onclick = ev => ev.stopPropagation();
    d.onmousedown = ev => { ev.stopPropagation(); ev.preventDefault();
      sel=i; playT=k.t; playing=false; drag={k, moved:false}; render(); };
    track.appendChild(d);
  });
  document.getElementById("playhead").style.left =
    (w * playT/(anim.duration||1)) + "px";

  const list = document.getElementById("kflist");
  list.innerHTML = "";
  anim.keyframes.forEach((k,i)=>{
    const c = document.createElement("span");
    c.className = "chip" + (i===sel?" sel":"");
    c.textContent = k.t.toFixed(2)+"s";
    c.onclick = ()=>{ sel=i; playT=k.t; render(); };
    list.appendChild(c);
  });
}

/* Drag a keyframe along the track. Snaps to 10 ms; hold Alt for free. */
let drag = null;
document.addEventListener("mousemove", ev=>{
  if(!drag) return;
  const tr = document.getElementById("track").getBoundingClientRect();
  let t = Math.max(0, Math.min(anim.duration, ((ev.clientX-tr.left)/tr.width)*anim.duration));
  if(!ev.altKey) t = Math.round(t*100)/100;
  if(t === drag.k.t) return;
  if(!drag.moved){ pushHistory("drag"); drag.moved = true; }
  drag.k.t = t;
  anim.keyframes.sort((a,b)=>a.t-b.t);
  sel = anim.keyframes.indexOf(drag.k); playT = t; render();
});
document.addEventListener("mouseup", ()=>{ drag = null; });

function dupKey(){
  pushHistory("dup");
  const src = kf();
  const copy = JSON.parse(JSON.stringify(src));
  copy.t = Math.round((src.t+0.2)*100)/100;
  while(anim.keyframes.some(k=>Math.abs(k.t-copy.t)<0.005)) copy.t = Math.round((copy.t+0.05)*100)/100;
  if(copy.t > anim.duration){ anim.duration = copy.t; document.getElementById("duration").value = copy.t; }
  anim.keyframes.push(copy); anim.keyframes.sort((a,b)=>a.t-b.t);
  sel = anim.keyframes.indexOf(copy); playT = copy.t;
  flash("keyframe duplicated"); render();
}
function copyPose(){ clip = JSON.parse(JSON.stringify(kf())); flash("keyframe values copied"); }
function pastePose(){
  if(!clip){ flash("nothing copied","warn"); return; }
  pushHistory("paste");
  const f = kf(), c = JSON.parse(JSON.stringify(clip));
  for(const part of ["both","left","right","face"]) f[part] = c[part]||{};
  f.ease = c.ease||f.ease; flash("pasted"); render();
}
function scaleTime(){
  const m = parseFloat(document.getElementById("tscale").value);
  if(!(m>0)){ flash("bad factor","warn"); return; }
  pushHistory("scale");
  anim.keyframes.forEach(k=>{ k.t = Math.round(k.t*m*1000)/1000; });
  anim.duration = Math.round(anim.duration*m*1000)/1000;
  document.getElementById("duration").value = anim.duration;
  playT = Math.min(playT*m, anim.duration); flash(`time ×${m}`); render();
}
const FLIP = ["x","rotation"], FLIP_FACE = ["look_x","tilt"];
function mirrorAnim(){
  pushHistory("mirror");
  const flip = (o,keys)=>{ for(const k of keys) if(o && k in o) o[k] = -o[k]; };
  anim.keyframes.forEach(k=>{
    [k.left, k.right] = [k.right||{}, k.left||{}];
    for(const part of [k.both,k.left,k.right]) flip(part, FLIP);   // lid_angle is anatomical: unchanged
    flip(k.face, FLIP_FACE);
  });
  flash("mirrored"); render();
}

/* ---- new / load / save ------------------------------------------------ */
function slug(n){
  return (n||"").toLowerCase().replace(/[^a-z0-9_-]+/g,"_").replace(/^[^a-z0-9]+/,"").slice(0,48).replace(/[_-]+$/,"") || "untitled";
}
function confirmDiscard(){
  return JSON.stringify(serialise())===snapshot || confirm("Discard unsaved changes?");
}
function loadAnim(d){
  anim = { name:d.name||"imported", duration:d.duration||1, loop:!!d.loop,
           priority:d.priority??50, interruptible:d.interruptible!==false,
           blink_suppress:!!d.blink_suppress, hold_last:d.hold_last!==false,
           tags:d.tags||[],
           keyframes:(d.keyframes||[]).map(k=>({
             t:k.t||0, both:{...(k.both||{})}, left:{...(k.left||{})}, right:{...(k.right||{})},
             face:{...(k.face||{})}, ease:k.ease||"in_out"})) };
  if(!anim.keyframes.length) anim.keyframes=[{t:0,both:{},left:{},right:{},face:{},ease:"in_out"}];
  anim.keyframes.sort((a,b)=>a.t-b.t);
  sel=0; playT=0; playing=false; drag=null;
  document.getElementById("playbtn").textContent = "▶ Play";
  history=[]; future=[]; lastPush={tag:"",at:0};
  writeProps();
  snapshot = JSON.stringify(serialise());
  render();
}
function newAnim(){
  if(!confirmDiscard()) return;
  loadAnim({name:"untitled", duration:1.0, keyframes:[{t:0, ease:"in_out"}]});
  flash("new animation");
}

async function loadSelected(){
  const n = document.getElementById("libsel").value;
  if(!confirmDiscard()) return;
  if(hasServer){
    try { loadAnim(await api("GET","/api/animation/"+encodeURIComponent(n))); flash("loaded "+n); }
    catch(e){ flash("load failed: "+e.message,"warn"); }
    return;
  }
  const d = INLINE[n];
  if(!d){ flash(`'${n}' is not inlined — import animations/builtin/${n}.json or run: python -m src.face edit`,"warn"); return; }
  loadAnim(d); flash("loaded "+n);
}

async function saveAnim(){
  render();
  const d = serialise();
  d.name = slug(d.name);
  if(d.name !== anim.name){ anim.name = d.name; document.getElementById("animname").value = d.name; }
  if(!hasServer){ exportJSON(); snapshot = JSON.stringify(serialise()); render(); return; }
  try {
    const r = await api("PUT","/api/animation/"+d.name, d);
    snapshot = JSON.stringify(serialise());
    await refreshLibrary(d.name);
    flash(`saved animations/${r.saved}`); render();
  } catch(e){ flash("save failed: "+e.message,"warn"); }
}

async function deleteSaved(){
  const n = slug(document.getElementById("animname").value);
  const row = library.find(a=>a.name===n);
  if(!row || row.source==="builtin"){ flash("no saved file with that name","warn"); return; }
  if(!confirm(`Delete the saved file for '${n}'?` + (row.source==="override"?" The builtin comes back.":""))) return;
  try { await api("DELETE","/api/animation/"+n); await refreshLibrary(n); flash("deleted "+n); }
  catch(e){ flash("delete failed: "+e.message,"warn"); }
}

/* Compare this file's JS interpolator with the Python one the robot runs. */
function poseDiff(a, b, path=""){
  if(a===null || b===null || typeof a!=="object" || typeof b!=="object"){
    if(a===null || b===null) return a===b ? null : `${path}: ${a} vs ${b}`;
    return Math.abs(a-b) < 1e-6 ? null : `${path}: js ${a} vs robot ${b}`;
  }
  for(const k of new Set([...Object.keys(a),...Object.keys(b)])){
    const r = poseDiff(a[k], b[k], path?path+"."+k:k); if(r) return r;
  }
  return null;
}
async function checkRobot(){
  render();
  const d = serialise(), N = 48, times = [];
  for(let i=0;i<=N;i++) times.push(+(d.duration*1.25*i/N).toFixed(4));
  try {
    const {poses} = await api("POST","/api/sample",{animation:d, times});
    for(let i=0;i<times.length;i++){
      const bad = poseDiff(sample(d, times[i]), poses[i]);
      if(bad){ flash(`MISMATCH at t=${times[i]}: ${bad}`,"warn"); return; }
    }
    flash(`matches the robot (${times.length} poses)`);
  } catch(e){ flash("check failed: "+e.message,"warn"); }
}

/* -------------------------------------------------------------- */
function togglePlay(){
  playing = !playing;
  document.getElementById("playbtn").textContent = playing ? "❚❚ Pause" : "▶ Play";
  lastFrame = performance.now();
  if(playing){ playT = 0; blinkPhase = -99; nextBlink = 1.5; }
}

function tick(now){
  if(playing){
    const dt = (now - lastFrame)/1000; lastFrame = now;
    playT += dt;
    if(playT > anim.duration){
      if(anim.loop){ playT = 0; nextBlink = 1.5; }
      else { playT = anim.duration; playing = false;
             document.getElementById("playbtn").textContent = "▶ Play"; }
    }
    render();
  }
  requestAnimationFrame(tick);
}

function scrubTo(){
  playing = false;
  document.getElementById("playbtn").textContent = "▶ Play";
  playT = (document.getElementById("scrub").value/1000)*(anim.duration||1);
  render();
}

function trackClick(ev){
  if(ev.target.classList.contains("kf")) return;
  const r = ev.currentTarget.getBoundingClientRect();
  playT = ((ev.clientX-r.left)/r.width)*(anim.duration||1);
  playing = false; render();
}

function addKey(){
  const t = Math.round(playT*100)/100;
  const existing = anim.keyframes.findIndex(k=>Math.abs(k.t-t)<0.005);
  if(existing >= 0){ sel = existing; render(); return; }
  pushHistory("addkey");
  anim.keyframes.push({t, both:{}, left:{}, right:{}, face:{}, ease:"in_out"});
  anim.keyframes.sort((a,b)=>a.t-b.t);
  sel = anim.keyframes.findIndex(k=>k.t===t);
  flash("keyframe added"); render();
}

function delKey(){
  if(anim.keyframes.length<=1){ flash("need at least one keyframe","warn"); return; }
  pushHistory("delkey");
  anim.keyframes.splice(sel,1);
  sel = Math.max(0, sel-1);
  flash("keyframe removed"); render();
}

function setKeyTime(){
  pushHistory("keytime");
  kf().t = Math.max(0, parseFloat(document.getElementById("kftime").value)||0);
  anim.keyframes.sort((a,b)=>a.t-b.t);
  sel = anim.keyframes.indexOf(kf());
  render();
}
function setKeyEase(){ pushHistory("ease"); kf().ease = document.getElementById("kfease").value; render(); }

function setTarget(t){
  target = t;
  ["both","left","right"].forEach(x=>
    document.getElementById("tb-"+x).classList.toggle("sel", x===t));
  render();
}

/* -------------------------------------------------------------- */
function serialise(){
  return {
    schema:1, name:anim.name, duration:anim.duration, loop:anim.loop,
    priority:anim.priority||50, interruptible:anim.interruptible!==false,
    blink_suppress:!!anim.blink_suppress, hold_last:anim.hold_last!==false,
    tags:anim.tags||[],
    keyframes:anim.keyframes.map(k=>{
      const o={t:+k.t.toFixed(3), ease:k.ease||"in_out"};
      for(const f of ["both","left","right","face"])
        if(k[f] && Object.keys(k[f]).length) o[f]=k[f];
      return o;
    })
  };
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(serialise(),null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (anim.name||"animation")+".json";
  a.click();
  flash("exported "+a.download);
}

function copyJSON(){
  navigator.clipboard.writeText(JSON.stringify(serialise(),null,2))
    .then(()=>flash("copied to clipboard"))
    .catch(()=>flash("clipboard blocked — select the textarea","warn"));
}

function importJSON(ev){
  const f = ev.target.files[0]; if(!f) return;
  ev.target.value = "";
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if(!confirmDiscard()) return;
      loadAnim(d);
      flash("imported "+anim.name);
    } catch(err){ flash("bad JSON: "+err.message,"warn"); }
  };
  r.readAsText(f);
}

function recordGIF(){
  // Browsers cannot write a GIF without a library, and bundling one would
  // break the single-file promise. PNG frames import into any GIF tool.
  const n = 24, step = anim.duration/n;
  for(let i=0;i<n;i++){
    drawFace(sample(anim, i*step));
    const a=document.createElement("a");
    a.href=cv.toDataURL("image/png");
    a.download=`${anim.name}_${String(i).padStart(3,"0")}.png`;
    a.click();
  }
  flash(`${n} frames downloaded`);
  render();
}

let flashTimer=null;
function flash(msg, kind){
  const el=document.getElementById("status");
  el.textContent=msg;
  el.style.color = kind==="warn" ? "var(--warn)" : "var(--ok)";
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>{el.textContent="";},2600);
}

document.addEventListener("keydown", e=>{
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if(e.ctrlKey||e.metaKey){
    const k = e.key.toLowerCase();
    if(k==="s"){ e.preventDefault(); saveAnim(); }
    else if(k==="z" && !typing){ e.preventDefault(); e.shiftKey?redo():undo(); }
    else if(k==="y" && !typing){ e.preventDefault(); redo(); }
    return;
  }
  if(typing||e.target.tagName==="SELECT") return;
  if(e.code==="Space"){ e.preventDefault(); togglePlay(); }
  if(e.key==="k") addKey();
  if(e.key==="Delete"||e.key==="Backspace") delKey();
  if(e.key==="ArrowRight"){ sel=Math.min(anim.keyframes.length-1,sel+1); playT=kf().t; render(); }
  if(e.key==="ArrowLeft"){ sel=Math.max(0,sel-1); playT=kf().t; render(); }
});

window.addEventListener("beforeunload", e=>{
  if(JSON.stringify(serialise())!==snapshot){ e.preventDefault(); e.returnValue=""; }
});

init();
</script>
